<div class="dashboard-container">


    <h1>
        NovaDesk Dashboard
    </h1>


    <h3>
        {{message}}
    </h3>



    <mat-card>


        <mat-card-title>
            Users
        </mat-card-title>



        <mat-card-content>


            <table>


                <tr>

                    <th>
                        Username
                    </th>


                    <th>
                        Email
                    </th>


                </tr>



                <tr *ngFor="let user of users">


                    <td>
                        {{user.username}}
                    </td>


                    <td>
                        {{user.email}}
                    </td>


                </tr>


            </table>


        </mat-card-content>


    </mat-card>


</div>
