<h1>
User Management
</h1>




<button

mat-raised-button

color="primary"

(click)="create()"

>

+ Create User

</button>



<br>
<br>





<table

mat-table

[dataSource]="users"

class="mat-elevation-z8"

>




<ng-container matColumnDef="username">


<th mat-header-cell *matHeaderCellDef>

Username

</th>



<td mat-cell *matCellDef="let user">

{{user.username}}

</td>


</ng-container>







<ng-container matColumnDef="email">


<th mat-header-cell *matHeaderCellDef>

Email

</th>



<td mat-cell *matCellDef="let user">

{{user.email}}

</td>


</ng-container>







<ng-container matColumnDef="role">


<th mat-header-cell *matHeaderCellDef>

Role

</th>



<td mat-cell *matCellDef="let user">

{{user.role}}

</td>


</ng-container>







<ng-container matColumnDef="actions">


<th mat-header-cell *matHeaderCellDef>

Actions

</th>




<td mat-cell *matCellDef="let user">





<button

mat-raised-button

color="primary"

(click)="edit(user)"

>

Edit ⚙

</button>





<button

mat-raised-button

color="accent"

(click)="manageRole(user)"

>

Role 🛡

</button>





<button

mat-raised-button

color="warn"

(click)="delete(user)"

>

Delete 🗑

</button>





</td>


</ng-container>







<tr

mat-header-row

*matHeaderRowDef="displayedColumns"

></tr>




<tr

mat-row

*matRowDef="let row; columns:displayedColumns"

></tr>




</table>
