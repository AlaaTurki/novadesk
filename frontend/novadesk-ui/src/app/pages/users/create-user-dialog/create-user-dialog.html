<h2>
Create User
</h2>



<mat-form-field appearance="outline">

<mat-label>
Username
</mat-label>


<input

matInput

[(ngModel)]="user.username"

>


</mat-form-field>



<br>



<mat-form-field appearance="outline">


<mat-label>
Email
</mat-label>


<input

matInput

[(ngModel)]="user.email"

>


</mat-form-field>




<br>




<mat-form-field appearance="outline">


<mat-label>
Password
</mat-label>


<input

matInput

type="password"

[(ngModel)]="user.password"

>


</mat-form-field>




<br>





<mat-form-field appearance="outline">


<mat-label>
Role
</mat-label>



<mat-select

[(ngModel)]="user.role"

>



<mat-option value="ADMIN">

ADMIN

</mat-option>



<mat-option value="USER">

USER

</mat-option>


</mat-select>



</mat-form-field>






<br>





<button

mat-raised-button

color="primary"

(click)="save()"

>

Create

</button>




<button

mat-button

(click)="cancel()"

>

Cancel

</button>
